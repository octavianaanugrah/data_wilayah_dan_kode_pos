<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wilayah & Kode Pos Indonesia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020617; 
            color: #f8fafc;
        }
        
        .fixed-width {
            width: 480px;
            margin: 0 auto;
        }

        .tree-group {
            display: none;
            flex-direction: column;
            margin-left: 24px;
            border-left: 2px solid rgba(255, 255, 255, 0.1);
            padding-top: 4px;
        }

        .tree-item[data-open="true"] > .tree-group {
            display: flex;
        }

        .tree-item {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .tree-item::before {
            content: "";
            position: absolute;
            left: -24px;
            top: 25px;
            width: 24px;
            height: 2px;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .box-premium {
            width: 100%;
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-radius: 14px;
            font-size: 14px;
            margin-bottom: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            user-select: none;
            color: white;
            font-weight: 800;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* WARNA ULTRA VIBRANT & GLOWING */
        /* Provinsi - Electric Indigo */
        .bg-prov { 
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.6);
        } 
        /* Kota - Vivid Sky */
        .bg-kota { 
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.5);
        } 
        /* Kecamatan - Bright Amber */
        .bg-keca { 
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 10px 20px -5px rgba(245, 158, 11, 0.5);
        } 
        /* Desa - Hyper Emerald */
        .bg-desa { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 8px 15px -5px rgba(16, 185, 129, 0.4);
        } 

        .box-premium:hover {
            transform: translateX(8px) scale(1.02);
            filter: brightness(120%);
            box-shadow: 0 15px 30px -10px rgba(255, 255, 255, 0.2);
        }

        .chevron-icon {
            transition: transform 0.3s ease;
        }
        .tree-item[data-open="true"] > .box-premium .chevron-icon {
            transform: rotate(180deg);
        }

        /* Badge Kode Pos */
        .badge-kodepos {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="p-12">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="text-3xl font-black tracking-tighter text-white italic">
                Wilayah & <span class="text-indigo-400">Kode Pos</span> Indonesia
            </h1>
            <div class="flex justify-center gap-2 mt-2">
                <span class="h-1 w-12 bg-indigo-500 rounded-full"></span>
                <span class="h-1 w-4 bg-sky-500 rounded-full"></span>
                <span class="h-1 w-4 bg-amber-500 rounded-full"></span>
            </div>
        </header>

        <div class="flex justify-center mb-10">
            <div class="relative fixed-width">
                <select id="provinsiSelect" class="w-full h-14 pl-6 pr-12 bg-slate-900/80 border-2 border-slate-800 text-white rounded-2xl appearance-none outline-none font-bold shadow-2xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all cursor-pointer backdrop-blur-md">
                    <option value="">Pilih Provinsi...</option>
                </select>
                <i data-lucide="chevron-down" class="absolute right-5 top-1/2 -translate-y-1/2 w-5 h-5 text-indigo-400"></i>
            </div>
        </div>

        <div id="hasil"></div>
    </div>

<script>
let provinsiData = [], kotaData = [], kecamatanData = [], desaData = [], kodeposData = [];

function initIcons() { lucide.createIcons(); }

document.getElementById('hasil').addEventListener('click', function(e) {
    const box = e.target.closest('.clickable-box');
    if (!box) return;

    const currentItem = box.parentElement;
    const parentGroup = currentItem.parentElement;
    const isNowOpen = currentItem.getAttribute('data-open') === 'true';

    const siblings = parentGroup.querySelectorAll(':scope > .tree-item');
    siblings.forEach(sib => {
        sib.setAttribute('data-open', 'false');
    });

    currentItem.setAttribute('data-open', isNowOpen ? 'false' : 'true');
});

Promise.all([
    fetch('https://octavianaanugrah.github.io/data_wilayah_dan_kode_pos/json/provinsi/data.json').then(res => res.json()),
    fetch('https://octavianaanugrah.github.io/data_wilayah_dan_kode_pos/json/kota_kab/data.json').then(res => res.json()),
    fetch('https://octavianaanugrah.github.io/data_wilayah_dan_kode_pos/json/kecamatan/data.json').then(res => res.json()),
    fetch('https://octavianaanugrah.github.io/data_wilayah_dan_kode_pos/json/desa/data.json').then(res => res.json()),
    fetch('https://octavianaanugrah.github.io/data_wilayah_dan_kode_pos/json/kode_pos/data.json').then(res => res.json())
]).then(([p, k, kc, d, kp]) => {
    provinsiData = p; kotaData = k; kecamatanData = kc; desaData = d; kodeposData = kp;
    const select = document.getElementById('provinsiSelect');
    provinsiData.sort((a,b) => a.nama_provinsi.localeCompare(b.nama_provinsi)).forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.id_provinsi; opt.textContent = item.nama_provinsi;
        select.appendChild(opt);
    });
});

document.getElementById('provinsiSelect').addEventListener('change', function() {
    const id = this.value;
    const res = document.getElementById('hasil');
    if(!id) { res.innerHTML = ''; return; }

    const prov = provinsiData.find(p => p.id_provinsi == id);

    let html = `
        <div class="fixed-width">
            <div class="tree-item" data-open="true">
                <div class="box-premium bg-prov cursor-default">
                    <i data-lucide="map" class="w-5 h-5 mr-3 text-white"></i>
                    <span class="flex-1 truncate tracking-wider uppercase text-sm">${prov.nama_provinsi}</span>
                </div>
                <div class="tree-group" style="display:flex;">
    `;

    kotaData.filter(k => k.id_provinsi == id).forEach(k => {
        html += `
            <div class="tree-item" data-open="false">
                <div class="box-premium bg-kota clickable-box">
                    <i data-lucide="building-2" class="w-5 h-5 mr-3 text-white"></i>
                    <span class="flex-1 truncate">${k.nama_kota}</span>
                    <i data-lucide="chevron-down" class="w-5 h-5 text-white/70 chevron-icon"></i>
                </div>
                <div class="tree-group">
        `;

        kecamatanData.filter(kc => kc.id_kota == k.id_kota).forEach(kc => {
            html += `
                <div class="tree-item" data-open="false">
                    <div class="box-premium bg-keca clickable-box">
                        <i data-lucide="map-pin" class="w-5 h-5 mr-3 text-white"></i>
                        <span class="flex-1 truncate text-sm tracking-wide">${kc.nama_kecamatan}</span>
                        <i data-lucide="chevron-down" class="w-5 h-5 text-white/70 chevron-icon"></i>
                    </div>
                    <div class="tree-group">
            `;

            desaData.filter(d => d.id_kecamatan == kc.id_kecamatan).forEach(d => {
                const kp = kodeposData.find(x => x.id_desa == d.id_desa);
                html += `
                    <div class="tree-item">
                        <div class="box-premium bg-desa cursor-default">
                            <i data-lucide="home" class="w-4 h-4 mr-3 text-white/80"></i>
                            <span class="flex-1 truncate text-sm font-bold text-white">${d.nama_desa}</span>
                            <span class="badge-kodepos font-black text-white">
                                ${kp ? kp.kode_pos : '-'}
                            </span>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
        });
        html += `</div></div>`;
    });

    html += `</div></div></div>`;
    res.innerHTML = html;
    initIcons();
});
</script>

</body>
</html>
